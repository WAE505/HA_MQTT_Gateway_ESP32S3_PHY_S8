esphome:
  name: ha-ble-proxy
  friendly_name: "BTHome BLE Proxy"
  on_boot:
    priority: -10
    then:
      - lambda: |-
          // Deferred BLE scan start — avoids WiFi/BLE radio contention at boot
          id(ble_scanner).start_scan();

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: false
  birth_message:
    topic: bthome/ha-ble-proxy/status
    payload: "online"
    retain: true
  will_message:
    topic: bthome/ha-ble-proxy/status
    payload: "offline"
    retain: true
  shutdown_message:
    topic: bthome/ha-ble-proxy/status
    payload: "offline"
    retain: true

ble_ext_scanner:
  id: ble_scanner
  scan_coded: true
  scan_1m: true
  scan_interval: 1100
  scan_window: 1100

ha_discovery:
  scanner_id: ble_scanner
  discovery_prefix: "homeassistant"
  state_prefix: "bthome"
  config_interval: 300
  state_interval: 10

# M5Stack Atom S3 Lite RGB LED (GPIO35 — NeoPixel SK6812)
light:
  - platform: neopixelbus
    id: status_led
    name: "Status LED"
    type: GRB
    variant: SK6812
    pin: GPIO35
    num_leds: 1
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Pulse Green"
          transition_length: 1.5s
          update_interval: 1.5s
          min_brightness: 5%
          max_brightness: 40%
      - strobe:
          name: "Flash Red"
          colors:
            - state: true
              brightness: 60%
              red: 100%
              green: 0%
              blue: 0%
              duration: 250ms
            - state: false
              duration: 250ms

# Check WiFi + MQTT status every 5s and update LED
interval:
  - interval: 5s
    then:
      - lambda: |-
          static uint8_t last_state = 0;  // 0=unknown, 1=error, 2=ok
          bool wifi_ok = wifi::global_wifi_component->is_connected();
          bool mqtt_ok = mqtt::global_mqtt_client->is_connected();
          uint8_t state = (wifi_ok && mqtt_ok) ? 2 : 1;
          if (state == last_state) return;
          last_state = state;
          auto call = id(status_led).turn_on();
          if (state == 2) {
            // Connected — slow pulsing green
            call.set_rgb(0.0f, 1.0f, 0.0f);
            call.set_effect("Pulse Green");
          } else {
            // Disconnected — flashing red
            call.set_effect("Flash Red");
          }
          call.perform();

# M5Stack Atom S3 Lite button (GPIO41) — factory reset
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    on_multi_click:
      - timing:
          - ON for at least 10s
        then:
          - logger.log: "Factory reset triggered"
          - lambda: |-
              // Restart the device
              App.safe_reboot();
