esphome:
  name: ha-ble-proxy
  friendly_name: "BTHome BLE Proxy"
  on_boot:
    priority: -10
    then:
      - lambda: |-
          // Deferred BLE scan start — avoids WiFi/BLE radio contention at boot
          id(ble_scanner).start_scan();

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: false
  birth_message:
    topic: bthome/ha-ble-proxy/status
    payload: "online"
    retain: true
  will_message:
    topic: bthome/ha-ble-proxy/status
    payload: "offline"
    retain: true
  shutdown_message:
    topic: bthome/ha-ble-proxy/status
    payload: "offline"
    retain: true

ble_ext_scanner:
  id: ble_scanner
  scan_coded: true
  scan_1m: true
  scan_interval: 1100
  scan_window: 1100

ha_discovery:
  scanner_id: ble_scanner
  discovery_prefix: "homeassistant"
  state_prefix: "bthome"
  config_interval: 300
  state_interval: 10

# M5Stack Atom S3 Lite status LED (GPIO35)
light:
  - platform: status_led
    name: "Status LED"
    pin: GPIO35

# M5Stack Atom S3 Lite button (GPIO41) — factory reset
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    on_multi_click:
      - timing:
          - ON for at least 10s
        then:
          - logger.log: "Factory reset triggered"
          - lambda: |-
              // Restart the device
              App.safe_reboot();
